<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./tracker.css">
</head>

<body>
    <div class="header">
        <p class="m-0">Expense<br>Tracker
            <img src="./spending.png" alt="" width="35px">
        </p>
    </div>

    <div class="input-form">
        <div class="form-floating inputs">
            <input type="email" class="form-control amountInput" id="floatingInput">
            <label for="floatingInput">Amount</label>
        </div>
        
        <select class="form-select inputs transactionInput" aria-label="Default select example" id="transactionType">
            <option selected>Transaction Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        
        <div class="form-floating  inputs">
            <input type="date" class="form-control dateInput" id="floatingInput">
            <label for="floatingInput">Date</label>
        </div>

        <button class="btn" id="add-button" onclick="addTransaction()">+</button>

    </div>

    <div class="cards mt-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title m-0">Total Income<br>
                    <img src="./wallet-filled-money-tool.png" alt="" width="35px">
                </h5>
                <h1 class="m-0">
                    <img src="./currency (2).png" alt="" width="35px">
                    <span id="totalIncome" class="m-0">0</span>
                </h1>

            </div>
         </div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title m-0">Total Expense<br>
                    <img src="./expenses.png" alt="" width="40px">
                </h5>
                <h1 class="m-0">
                    <img src="./currency (2).png" alt="" width="35px">
                    <span id="totalExpense" class="m-0">0</span>
                </h1>

            </div>
        </div>
        <div class="card" >
            <div class="card-body">
                <h5 class="card-title m-0">Balance<br>
                    <img src="./rupee.png" alt="" width="35px">
                </h5>
                <h1 class="m-0">
                    <img src="./currency (2).png" alt="" width="35px">
                    <span id="balance" class="m-0">0</span>
                </h1>

            </div>
        </div>
    </div>
    <table class="transaction-table mt-3" id="table">
        <tr id="header-row">
            <th>Amount</th>
            <th>Transaction Type</th>
            <th>Transaction Date</th>
            <th>Action</th>
        </tr>
    </table>

    <script>
        let table = document.getElementById('table')
        console.log("Table", table);

        function deleteRow(row){
            console.log("Deleting Row")
            console.log(row)
            row.remove();
        }

        function addTransaction(){
            let date = document.getElementsByClassName('dateInput')[0].value
            let amount = document.getElementsByClassName('amountInput')[0].value
            let transaction = document.getElementsByClassName('transactionInput')[0].value
            console.log(date,amount,transaction);
            // let transactionType = document.getElementById('transactionType')
            
            if(date==="" || transaction ==="" || amount ===""){
                alert("Please Enter All the values ");
                return;
            }
            let row = document.createElement('tr')

            // Creating Data Cells 
            let dateCell = document.createElement('td')
            dateCell.innerText=date;

            let amountCell = document.createElement('td')
            amountCell.innerText=amount;

            let transactionCell = document.createElement('td')
            transactionCell.innerText=transaction;

            let deleteCell = document.createElement('td')

            let deleteBtn = document.createElement('button')
            // deleteBtn.innerText = "delete"

            let binImg = document.createElement('img')
            binImg.src='./recycle-bin.png'
            binImg.style.width='25px'
            binImg.style.height='25px'
            deleteBtn.appendChild(binImg)
            deleteBtn.classList.add('delete-button')
            deleteBtn.onclick=()=>deleteRow(row)
            deleteCell.appendChild(deleteBtn);
            // appending rows into table using JS 

            row.appendChild(dateCell)
            row.appendChild(amountCell)
            row.appendChild(transactionCell)
            row.appendChild(deleteCell)
                // deleteCell.appendChild(binImg)

            table.appendChild(row)

            let totalIncome = document.getElementById('totalIncome').innerText
            let totalExpense = document.getElementById('totalExpense').innerText
            let balance = document.getElementById('balance').innerText
            
            console.log("Line 146:",totalIncome,totalExpense,balance);
            if(transaction=='income'){
                if(totalIncome=='0'){
                    document.getElementById('totalIncome').innerText = amount;
                }
                else{
                    document.getElementById('totalIncome').innerText= parseInt(totalIncome)+parseInt(amount);
                }
                if(balance=='0'){
                    document.getElementById('balance').innerText = amount;
                }
                else{
                    document.getElementById('balance').innerText = parseInt(balance)+parseInt(amount);
                }
            }
            else if(transaction=='expense'){
                if(totalExpense == '0'){
                    document.getElementById('totalExpense').innerText = amount;
                }
                else{
                    document.getElementById('totalExpense').innerText = parseInt(totalExpense) + parseInt(amount);
                }
                if(balance>'0'){
                    document.getElementById('balance').innerText = parseInt(balance)-parseInt(amount);
                }
            }
        }
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
</body>

</html>
